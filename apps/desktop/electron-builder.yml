# electron-builder configuration.
#
# PHASE 0: present and coherent, but packaging is NOT part of the Phase 0
# acceptance criteria. Installer production happens in Phase 4, together with
# bundling the private PostgreSQL cluster.
appId: ph.hexpayroll.desktop
productName: Hex Payroll
copyright: Copyright © 2026 Hex Payroll

directories:
  output: release
  buildResources: build

# Ship only the built outputs, never the TypeScript sources.
files:
  - out/**
  - package.json

# apps/web's production build is shipped alongside the app and loaded over
# file:// by the main process — see apps/desktop/src/main/index.ts.
extraResources:
  - from: ../web/dist
    to: web

win:
  target:
    - nsis
  # Code signing is REQUIRED before distributing to real users: an unsigned
  # installer triggers Windows SmartScreen warnings on every machine.

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

# Auto-update is intentionally NOT configured.
# For a payroll system, silently shipping changed contribution or tax tables
# mid-period is an incident rather than a convenience. It will be added
# deliberately, with an explicit opt-in, in Phase 4.
